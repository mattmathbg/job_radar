<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobRadar — Hunt Smarter. Not Harder.</title>
  <meta name="description" content="Open-source job search agent that scores listings with local AI. 8 boards. Zero cloud. Your data stays yours.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'JetBrains Mono', monospace; }
    ::selection { background: #22c55e; color: #000; }
    @keyframes scanline {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }
    .scanline-effect::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 0, 0.03) 51%, transparent 100%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 50;
    }
    .glitch-hover:hover {
      animation: glitch-anim 0.2s infinite;
      color: #0f0;
    }
    @keyframes glitch-anim {
      0% { text-shadow: 2px 2px #0f0, -2px -2px #f0f; }
      25% { text-shadow: -2px 2px #0f0, 2px -2px #f0f; }
      50% { text-shadow: 2px -2px #0f0, -2px 2px #f0f; }
      75% { text-shadow: -2px -2px #0f0, 2px 2px #f0f; }
      100% { text-shadow: 2px 2px #0f0, -2px -2px #f0f; }
    }
    .moving-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      animation: moveGrid 20s linear infinite;
    }
    @keyframes moveGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .marquee-scroll { animation: marquee 20s linear infinite; }
    .terminal-cursor::after {
      content: "█";
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body class="bg-[#050505] text-white">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, useAnimation } = window["framer-motion"] || {};

    const FramerDiv = motion?.div || 'div';

    const JobRadarLanding = () => {
      const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMousePosition({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, []);

      const copyInstall = () => {
        navigator.clipboard.writeText("curl -fsSL https://raw.githubusercontent.com/ANIRudH-lab-life/job-radar/main/setup.sh | bash");
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const features = [
        { icon: "⚡", title: "100% Local Processing", desc: "Auto-detects Ollama or llama.cpp. Scores each job 0-100 on skills, experience, and remote fit entirely on your machine. Your data never leaves.", color: "blue" },
        { icon: "📡", title: "8 Free Sources", desc: "Remotive, Arbeitnow, RemoteOK, Jobicy, Himalayas, Greenhouse ATS, Ashby ATS, and LinkedIn (opt-in). All concurrent.", color: "purple" },
        { icon: "🔒", title: "Zero Cloud Dependencies", desc: "No API keys. No subscriptions. No data leaving your laptop. Works completely offline once set up.", color: "red" },
        { icon: "🖥️", title: "Web Dashboard", desc: "Kanban pipeline, rich job cards, config editor, and activity log at localhost:3000.", color: "green" },
        { icon: "🗄️", title: "Persistent Cache", desc: "SQLite cache with 7-day TTL. Never re-review the same jobs. Skip seen listings automatically.", color: "yellow" },
        { icon: "🌍", title: "Cross-Platform", desc: "Linux, macOS, and Windows. One-command install. Pick Ollama or llama.cpp during setup.", color: "cyan" },
      ];

      const sources = [
        { name: "Remotive", type: "API", note: "Remote jobs" },
        { name: "Arbeitnow", type: "API", note: "Worldwide, paginated" },
        { name: "RemoteOK", type: "API", note: "Remote jobs" },
        { name: "Jobicy", type: "API", note: "Remote + salary data" },
        { name: "Himalayas", type: "API", note: "Seniority levels" },
        { name: "Greenhouse", type: "ATS", note: "15 companies" },
        { name: "Ashby", type: "ATS", note: "15 companies" },
        { name: "LinkedIn", type: "Scrape", note: "Opt-in" },
      ];

      const steps = [
        { num: "01", title: "Clone & Install", cmd: "git clone https://github.com/ANIRudH-lab-life/job-radar && cd job-radar && bash setup.sh" },
        { num: "02", title: "Pick Your LLM", cmd: "Ollama (recommended) or llama.cpp — installer handles everything" },
        { num: "03", title: "Search & Score", cmd: 'python -m jobradar -q "python developer" -p profile.yaml' },
        { num: "04", title: "Track in Dashboard", cmd: "cd dashboard && bash run.sh → localhost:3000" },
      ];

      return (
        <div className="relative min-h-screen bg-[#050505] text-white overflow-hidden">
          {/* Scanline overlay */}
          <div className="scanline-effect fixed inset-0 pointer-events-none mix-blend-overlay opacity-30"></div>

          {/* Mouse glow */}
          <div
            className="fixed top-0 left-0 w-[600px] h-[600px] bg-green-500/15 rounded-full blur-[120px] pointer-events-none z-0 transition-all duration-500"
            style={{ transform: `translate(${mousePosition.x - 300}px, ${mousePosition.y - 300}px)` }}
          />

          {/* Grid background */}
          <div className="absolute inset-0 moving-grid z-0 opacity-20"></div>

          {/* NAVBAR */}
          <nav className="relative z-50 flex items-center justify-between p-6 border-b border-white/10 backdrop-blur-md bg-black/50">
            <div className="flex items-center gap-2 font-black text-xl tracking-tighter">
              <span className="text-green-400 text-2xl">◎</span>
              <span className="glitch-hover cursor-pointer">JOB_RADAR</span>
            </div>
            <div className="flex items-center gap-4">
              <a href="https://github.com/ANIRudH-lab-life/job-radar" target="_blank" rel="noopener"
                 className="flex items-center gap-2 bg-white text-black px-4 py-2 hover:bg-green-400 transition-colors font-bold uppercase text-sm">
                ★ Star on GitHub
              </a>
            </div>
          </nav>

          <main className="relative z-10">

            {/* HERO */}
            <section className="flex flex-col items-center justify-center pt-24 pb-16 px-6 text-center max-w-5xl mx-auto">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 border border-green-500/30 bg-green-500/10 text-green-400 text-xs font-bold uppercase tracking-widest mb-8">
                ⚡ Local LLM Powered • Open Source • MIT Licensed
              </div>

              <h1 className="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-[0.9] mb-6">
                Hunt <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">Smarter.</span><br/>
                Not Harder.
              </h1>

              <p className="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                A CLI job search agent that hunts across 8 sources at once, rated locally by AI.
                <strong className="text-white block mt-2">You are the loop. The AI is just the filter.</strong>
              </p>

              {/* Install command */}
              <div onClick={copyInstall}
                   className="group relative inline-block cursor-pointer border border-green-500/30 hover:border-green-500/60 transition-all rounded-lg overflow-hidden">
                <div className="bg-black border border-white/10 px-6 py-4 flex items-center gap-4 font-mono text-sm">
                  <span className="text-green-500">➜</span>
                  <span className="text-gray-300">curl -fsSL https://raw.github... | bash</span>
                  <span className="ml-4 bg-white/10 hover:bg-green-500/30 px-3 py-1 text-xs font-bold uppercase transition-colors">
                    {copied ? "✓ Copied" : "Copy"}
                  </span>
                </div>
              </div>

              <div className="flex gap-4 mt-8 text-sm text-gray-500">
                <span>Linux</span><span>•</span><span>macOS</span><span>•</span><span>Windows</span><span>•</span><span>MIT License</span>
              </div>
            </section>

            {/* MARQUEE */}
            <div className="w-full overflow-hidden border-y border-white/10 bg-green-500 text-black py-3 font-black text-xl uppercase tracking-widest">
              <div className="marquee-scroll whitespace-nowrap flex gap-8">
                {Array(15).fill(null).map((_, i) => (
                  <span key={i}>• HUMAN IN THE LOOP • ZERO CLOUD APIS • 8 DATA SOURCES • DIRECT ATS SCRAPING • LOCAL AI SCORING • MIT LICENSED • </span>
                ))}
              </div>
            </div>

            {/* STATS BAR */}
            <section className="relative z-10 grid grid-cols-2 md:grid-cols-4 gap-px bg-white/10 border-b border-white/10">
              {[
                { num: "8", label: "Job Sources" },
                { num: "0", label: "Cloud APIs" },
                { num: "1.1GB", label: "Model Size" },
                { num: "0", label: "Monthly Cost" },
              ].map((stat, i) => (
                <div key={i} className="bg-[#0a0a0a] p-8 text-center">
                  <div className="text-4xl font-black text-green-400">{stat.num}</div>
                  <div className="text-sm text-gray-500 mt-2 uppercase tracking-wider">{stat.label}</div>
                </div>
              ))}
            </section>

            {/* BENTO FEATURES */}
            <section className="max-w-6xl mx-auto px-6 py-24">
              <h2 className="text-4xl font-black uppercase tracking-tighter mb-12 text-center">
                What It <span className="text-green-400">Does</span>
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {/* Feature 1 - Large */}
                <div className="col-span-1 md:col-span-2 bg-[#0a0a0a] border border-white/10 p-8 rounded-2xl relative overflow-hidden group hover:border-green-500/30 transition-colors">
                  <div className="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 blur-[80px] rounded-full group-hover:bg-blue-500/20 transition-all"></div>
                  <div className="text-5xl mb-6">⚡</div>
                  <h3 className="text-2xl font-bold mb-3">100% Local Processing</h3>
                  <p className="text-gray-400 leading-relaxed">Auto-detects Ollama or llama.cpp. Scores each job 0-100 on skills match, experience fit, salary fit, and remote fit entirely on your machine. Your resume data never leaves your laptop.</p>
                </div>

                {/* Feature 2 */}
                <div className="bg-[#0a0a0a] border border-white/10 p-8 rounded-2xl hover:border-purple-500/30 transition-colors">
                  <div className="text-5xl mb-6">📡</div>
                  <h3 className="text-2xl font-bold mb-3">8 Free Sources</h3>
                  <p className="text-gray-400">Remotive, Arbeitnow, RemoteOK, Jobicy, Himalayas, Greenhouse ATS, Ashby ATS, and LinkedIn.</p>
                </div>

                {/* Feature 3 */}
                <div className="bg-[#0a0a0a] border border-white/10 p-8 rounded-2xl hover:border-red-500/30 transition-colors">
                  <div className="text-5xl mb-6">🔒</div>
                  <h3 className="text-2xl font-bold mb-3">Zero Cloud</h3>
                  <p className="text-gray-400">No API keys. No subscriptions. No data leaving your laptop. Works completely offline once set up.</p>
                </div>

                {/* Feature 4 */}
                <div className="bg-[#0a0a0a] border border-white/10 p-8 rounded-2xl hover:border-yellow-500/30 transition-colors">
                  <div className="text-5xl mb-6">🗄️</div>
                  <h3 className="text-2xl font-bold mb-3">Smart Cache</h3>
                  <p className="text-gray-400">SQLite cache with configurable TTL. Never re-review the same jobs. Skip seen listings automatically.</p>
                </div>

                {/* Feature 5 */}
                <div className="bg-[#0a0a0a] border border-white/10 p-8 rounded-2xl hover:border-cyan-500/30 transition-colors">
                  <div className="text-5xl mb-6">🌍</div>
                  <h3 className="text-2xl font-bold mb-3">Cross-Platform</h3>
                  <p className="text-gray-400">Linux, macOS, Windows. One-command install. Pick Ollama or llama.cpp during setup.</p>
                </div>

                {/* Dashboard Card - Full Width */}
                <div className="col-span-1 md:col-span-3 bg-[#0a0a0a] border border-white/10 p-10 rounded-2xl relative overflow-hidden group hover:border-green-500/30 transition-colors">
                  <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent z-10"></div>
                  <div className="relative z-20">
                    <div className="text-5xl mb-6">🖥️</div>
                    <h3 className="text-3xl font-bold mb-3">Web Dashboard Included</h3>
                    <p className="text-gray-400 max-w-xl">Visualize everything with a Kanban pipeline, color-coded match scores, interactive config editor, and live activity log at localhost:3000.</p>
                  </div>
                  {/* Mock dashboard */}
                  <div className="absolute right-8 top-12 w-[500px] h-[320px] bg-black border border-white/20 rounded-xl shadow-2xl p-4 flex flex-col gap-3 opacity-60 group-hover:opacity-100 transition-opacity hidden md:flex">
                    <div className="h-4 w-full bg-white/5 rounded"></div>
                    <div className="flex gap-3 flex-1">
                      <div className="flex-1 bg-green-500/20 border border-green-500/50 rounded-lg flex items-center justify-center font-bold text-green-400 text-sm">Match 95%</div>
                      <div className="flex-1 bg-yellow-500/20 border border-yellow-500/50 rounded-lg flex items-center justify-center font-bold text-yellow-400 text-sm">Match 72%</div>
                      <div className="flex-1 bg-red-500/20 border border-red-500/50 rounded-lg flex items-center justify-center font-bold text-red-400 text-sm">Match 40%</div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1 h-8 bg-white/5 rounded"></div>
                      <div className="flex-1 h-8 bg-white/5 rounded"></div>
                      <div className="flex-1 h-8 bg-white/5 rounded"></div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* HOW IT WORKS */}
            <section className="max-w-4xl mx-auto px-6 py-24">
              <h2 className="text-4xl font-black uppercase tracking-tighter mb-12 text-center">
                Get Started in <span className="text-green-400">4 Steps</span>
              </h2>
              <div className="space-y-6">
                {steps.map((step, i) => (
                  <div key={i} className="flex items-start gap-6 bg-[#0a0a0a] border border-white/10 p-6 rounded-xl hover:border-green-500/30 transition-colors">
                    <div className="text-3xl font-black text-green-400/40">{step.num}</div>
                    <div className="flex-1">
                      <h3 className="text-xl font-bold mb-2">{step.title}</h3>
                      <div className="bg-black border border-white/10 rounded-lg px-4 py-3 font-mono text-sm text-gray-400">
                        <span className="text-green-500">$</span> {step.cmd}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* SOURCES TABLE */}
            <section className="max-w-4xl mx-auto px-6 py-24">
              <h2 className="text-4xl font-black uppercase tracking-tighter mb-12 text-center">
                <span className="text-green-400">8</span> Sources, One Search
              </h2>
              <div className="bg-[#0a0a0a] border border-white/10 rounded-2xl overflow-hidden">
                <div className="grid grid-cols-3 gap-px bg-white/10 text-xs font-bold uppercase tracking-wider text-gray-500">
                  <div className="bg-[#0a0a0a] p-4">Source</div>
                  <div className="bg-[#0a0a0a] p-4">Type</div>
                  <div className="bg-[#0a0a0a] p-4">Notes</div>
                </div>
                {sources.map((src, i) => (
                  <div key={i} className="grid grid-cols-3 gap-px bg-white/5 hover:bg-white/10 transition-colors">
                    <div className="bg-[#0a0a0a] p-4 font-bold">{src.name}</div>
                    <div className="bg-[#0a0a0a] p-4">
                      <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                        src.type === 'ATS' ? 'bg-purple-500/20 text-purple-400' :
                        src.type === 'Scrape' ? 'bg-yellow-500/20 text-yellow-400' :
                        'bg-green-500/20 text-green-400'
                      }`}>{src.type}</span>
                    </div>
                    <div className="bg-[#0a0a0a] p-4 text-gray-400">{src.note}</div>
                  </div>
                ))}
              </div>
            </section>

            {/* CTA */}
            <section className="text-center py-24 px-6 border-t border-white/10">
              <h2 className="text-5xl md:text-6xl font-black uppercase tracking-tighter mb-6">
                Ready to <span className="text-green-400">Hunt Smarter?</span>
              </h2>
              <p className="text-gray-400 text-lg mb-10 max-w-xl mx-auto">
                Stop drowning in tabs. Let local AI do the filtering. You decide what fits.
              </p>
              <div className="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="https://github.com/ANIRudH-lab-life/job-radar" target="_blank" rel="noopener"
                   className="bg-green-500 text-black px-8 py-4 font-black uppercase text-lg hover:bg-green-400 transition-colors">
                  ★ Star on GitHub
                </a>
                <a href="https://github.com/ANIRudH-lab-life/job-radar#quick-install" target="_blank" rel="noopener"
                   className="border border-white/20 px-8 py-4 font-bold uppercase text-lg hover:border-green-500/50 hover:bg-white/5 transition-colors">
                  Read the Docs →
                </a>
              </div>
            </section>

            {/* FOOTER */}
            <footer className="border-t border-white/10 p-6 text-center text-gray-600 text-sm">
              <p>Built with ❤️ by <a href="https://github.com/ANIRudH-lab-life" className="text-green-400 hover:underline">Anirudh</a> • MIT Licensed • <a href="https://github.com/ANIRudH-lab-life/job-radar" className="text-green-400 hover:underline">GitHub</a></p>
            </footer>
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<JobRadarLanding />);
  </script>
</body>
</html>
